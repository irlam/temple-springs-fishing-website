name: Booking application tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, xmlwriter, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: find app public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: node tests/http.mjs
      - run: node tests/cli.mjs
      - run: node tests/plesk-setup.mjs
      - run: php tests/demo.php
      - run: node tests/demo-browser.mjs
      - run: node tests/migration.mjs
      - run: node --check public/booking.js && node --check public/sw.js && node --check public/fishery.js && node --check public/demo.js && node --check public/demo-scan.js
